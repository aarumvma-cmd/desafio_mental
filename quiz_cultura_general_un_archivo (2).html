  <main id="app">
    <section id="home" class="screen active">
      <div class="hero">
        <div class="hero-badge">🎓 QUIZ EDUCATIVO</div>
        <h1>Cultura General</h1>
        <p>60 retos visuales de Historia, Geografía, Aritmética, Geometría, Biología y Anatomía.</p>
        <div class="home-stats">
          <div><strong>60</strong><span>preguntas</span></div>
          <div><strong>6</strong><span>materias</span></div>
          <div><strong>600</strong><span>puntos</span></div>
        </div>
      </div>
      <div class="mode-panel">
        <h2>Elige tu modo</h2>
        <div class="mode-grid">
          <button class="mode-card" data-mode="general"><span>🎯</span><b>Modo general</b><small>Las 60 preguntas mezcladas</small></button>
          <button class="mode-card" data-mode="category"><span>📚</span><b>Por categoría</b><small>Elige una materia</small></button>
          <button class="mode-card" data-mode="random"><span>🎲</span><b>Aleatorio</b><small>Preguntas seleccionadas al azar</small></button>
          <button class="mode-card" data-mode="basico"><span>🟢</span><b>Básico</b><small>18 preguntas fundamentales</small></button>
          <button class="mode-card" data-mode="intermedio"><span>🟡</span><b>Intermedio</b><small>24 preguntas de aplicación</small></button>
          <button class="mode-card" data-mode="avanzado"><span>🔴</span><b>Avanzado</b><small>18 retos de razonamiento</small></button>
        </div>
        <div id="category-picker" class="category-picker hidden"></div>
      </div>
    </section>

    <section id="quiz" class="screen">
      <header class="quiz-top">
        <button id="quit-btn" class="ghost-btn">← Salir</button>
        <div class="score-box">⭐ <span id="score">0</span></div>
      </header>
      <div class="progress-wrap">
        <div class="progress-meta"><span id="progress-label">Pregunta 1 de 60</span><span id="percent">0%</span></div>
        <div class="progress"><div id="progress-bar"></div></div>
      </div>
      <article class="question-card">
        <div class="question-meta"><span id="category-chip"></span><span id="difficulty-chip"></span></div>
        <div class="image-frame"><img id="question-image" alt=""></div>
        <div class="question-content">
          <h2 id="question-text"></h2>
          <div id="answers" class="answers"></div>
          <div id="feedback" class="feedback hidden"></div>
          <button id="next-btn" class="next-btn hidden">Siguiente →</button>
        </div>
      </article>
    </section>

    <section id="results" class="screen">
      <div class="results-card">
        <div class="trophy">🏆</div>
        <p class="eyebrow">RESULTADO FINAL</p>
        <h1 id="result-title">¡Buen trabajo!</h1>
        <div class="big-score"><span id="final-score">0</span><small>/ 600</small></div>
        <p id="result-message"></p>
        <div class="result-grid">

          <div><strong id="wrong-count">0</strong><span>Incorrectas</span></div>
          <div><strong id="final-percent">0%</strong><span>Porcentaje</span></div>
        </div>
        <div id="category-results" class="category-results"></div>
        <div class="result-actions">
          <button id="restart-btn" class="primary-btn">Jugar otra vez</button>
          <button id="home-btn" class="secondary-btn">Volver al inicio</button>
        </div>
      </div>
    </section>
  </main>

const $ = s => document.querySelector(s);
const screens = {home:$("#home"), quiz:$("#quiz"), results:$("#results")};
let state = {questions:[], index:0, score:0, correct:0, wrong:0, answered:false, mode:"general", category:null, byCat:{}};

const difficultyLabel = {basico:"🟢 BÁSICO",intermedio:"🟡 INTERMEDIO",avanzado:"🔴 AVANZADO"};
const categoryIcons = {Historia:"📚",Geografía:"🌎",Aritmética:"➗",Geometría:"📐",Biología:"🧬",Anatomía:"🫀"};

function show(name){Object.values(screens).forEach(x=>x.classList.remove("active"));screens[name].classList.add("active");window.scrollTo({top:0,behavior:"smooth"});}
function shuffle(a){return [...a].sort(()=>Math.random()-.5)}
function start(mode, category=null){
  state={questions:[],index:0,score:0,correct:0,wrong:0,answered:false,mode,category,byCat:{}};
  let pool=[...QUESTION_BANK];
  if(mode==="category") pool=pool.filter(q=>q.categoria===category);
  if(["basico","intermedio","avanzado"].includes(mode)) pool=pool.filter(q=>q.dificultad===mode);
  if(mode==="random") pool=shuffle(pool).slice(0,20);
  if(mode==="general") pool=shuffle(pool);
  else if(mode!=="random" && mode!=="category") pool=shuffle(pool);
  state.questions=pool;
  state.questions.forEach(q=>state.byCat[q.categoria]??={c:0,t:0});
  show("quiz"); renderQuestion();
}
document.querySelectorAll(".mode-card").forEach(btn=>{
  btn.addEventListener("click",()=>{
    const mode=btn.dataset.mode;
    if(mode==="category"){
      const picker=$("#category-picker"); picker.classList.toggle("hidden");
      picker.innerHTML=Object.keys(categoryIcons).map(c=>`<button data-cat="${c}">${categoryIcons[c]} ${c}</button>`).join("");
      picker.querySelectorAll("button").forEach(b=>b.onclick=()=>start("category",b.dataset.cat));
    }else start(mode);
  });
});
function renderQuestion(){
  const q=state.questions[state.index]; state.answered=false;
  $("#score").textContent=state.score;
  $("#progress-label").textContent=`Pregunta ${state.index+1} de ${state.questions.length}`;
  const pct=Math.round(state.index/state.questions.length*100); $("#percent").textContent=pct+"%"; $("#progress-bar").style.width=pct+"%";
  $("#category-chip").textContent=`${categoryIcons[q.categoria]} ${q.categoria}`;
  $("#difficulty-chip").textContent=difficultyLabel[q.dificultad];
  const img=$("#question-image"); img.src=q.imagen; img.alt=q.textoAlternativo;
  $("#question-text").textContent=q.pregunta;
  $("#feedback").className="feedback hidden"; $("#feedback").innerHTML="";
  $("#next-btn").className="next-btn hidden";
  const answers=$("#answers"); answers.innerHTML="";
  q.opciones.forEach((opt,i)=>{
    const b=document.createElement("button"); b.className="answer"; b.innerHTML=`<span>${String.fromCharCode(65+i)})</span> ${opt}`;
    b.onclick=()=>answer(i); answers.appendChild(b);
  });
}
function answer(i){
  if(state.answered)return; state.answered=true;
  const q=state.questions[state.index], buttons=[...document.querySelectorAll(".answer")];
  const ok=i===q.respuestaCorrecta; buttons.forEach(b=>b.disabled=true);
  buttons[q.respuestaCorrecta].classList.add("correct"); if(!ok)buttons[i].classList.add("wrong");
  if(ok){state.score+=10;state.correct++}else state.wrong++;
  state.byCat[q.categoria]??={c:0,t:0}; state.byCat[q.categoria].t++; if(ok)state.byCat[q.categoria].c++;
  $("#score").textContent=state.score;
  const fb=$("#feedback"); fb.className="feedback";
  fb.innerHTML=`<strong>${ok?"✅ ¡Correcto!":"❌ Incorrecto."}</strong>
  <div>${ok?"Muy bien.":`La respuesta correcta es <b>${q.opciones[q.respuestaCorrecta]}</b>.`}</div>
  <p>${q.explicacion}</p>
  ${q.procedimiento?`<div class="procedure"><b>🧮 Procedimiento</b><br>${q.procedimiento}</div>`:""}
  <p><b>💡 Dato interesante:</b> ${q.dato}</p>`;
  $("#next-btn").className="next-btn";
  $("#progress-bar").style.width=Math.round((state.index+1)/state.questions.length*100)+"%";
}
$("#next-btn").onclick=()=>{if(state.index<state.questions.length-1){state.index++;renderQuestion()}else finish()};
function finish(){
  show("results");
  const total=state.questions.length, pct=Math.round(state.correct/total*100);
  $("#final-score").textContent=state.score; $("#correct-count").textContent=state.correct; $("#wrong-count").textContent=state.wrong; $("#final-percent").textContent=pct+"%";
  const tier=pct>=90?["Excelente","🏆"]:pct>=80?["Muy bueno","⭐"]:pct>=70?["Bueno","👍"]:pct>=60?["Puedes mejorar","📚"]:["Sigue practicando","💪"];
  $("#result-title").textContent=`${tier[1]} ${tier[0]}`;
  $("#result-message").textContent=pct>=70?"Tu desempeño muestra una buena base. ¡Sigue retándote!":"Cada intento es una oportunidad para aprender. ¡Vuelve a jugar y supera tu marca!";
  const rows=Object.entries(state.byCat).map(([c,v])=>`<div class="cat-row"><b>${categoryIcons[c]} ${c}</b><div class="cat-track"><i style="width:${v.t/v.t* (v.c/v.t*100)}%"></i></div><small>${v.c}/${v.t}</small></div>`).join("");
  $("#category-results").innerHTML=rows;
}
$("#quit-btn").onclick=()=>show("home");
$("#home-btn").onclick=()=>show("home");
$("#restart-btn").onclick=()=>start(state.mode,state.category);

</script>
